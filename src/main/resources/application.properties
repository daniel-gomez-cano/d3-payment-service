# ========================
# SERVIDOR
# ========================
server.port=8084

# ========================
# BASE DE DATOS
# ========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:paymentdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# KEYCLOAK
# ========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/viva-eventos}

# ========================
# MERCADOPAGO
# ========================
# Nunca pongas el access token directamente aquí — usa variables de entorno
mercadopago.access-token=${MP_ACCESS_TOKEN:TEST-0000000000000000-000000-00000000000000000000000000000000-000000000}
mercadopago.sandbox=${MP_SANDBOX:true}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:changeme-webhook-secret}
# URL base donde MercadoPago enviará las notificaciones (debe ser pública o usar ngrok en local)
mercadopago.notification-url=${MP_NOTIFICATION_URL:http://localhost:8084/api/payments/webhook/mercadopago}
# URLs a donde MP redirige al comprador tras el pago
mercadopago.back-url.success=${MP_BACK_URL_SUCCESS:http://localhost:3000/checkout/success}
mercadopago.back-url.failure=${MP_BACK_URL_FAILURE:http://localhost:3000/checkout/failure}
mercadopago.back-url.pending=${MP_BACK_URL_PENDING:http://localhost:3000/checkout/pending}

# ========================
# OTROS SERVICIOS
# ========================
order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}

# ========================
# RESILIENCIA (Resilience4j)
# ========================

# Circuit Breaker para llamadas a MercadoPago
resilience4j.circuitbreaker.instances.mercadopago.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.mercadopago.sliding-window-size=10
resilience4j.circuitbreaker.instances.mercadopago.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mercadopago.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mercadopago.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mercadopago.register-health-indicator=true

# Circuit Breaker para llamadas al order-service
resilience4j.circuitbreaker.instances.order-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.order-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.order-service.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.order-service.register-health-indicator=true

# Retry para llamadas a MercadoPago (3 intentos, espera exponencial)
resilience4j.retry.instances.mercadopago.max-attempts=3
resilience4j.retry.instances.mercadopago.wait-duration=2s
resilience4j.retry.instances.mercadopago.enable-exponential-backoff=true
resilience4j.retry.instances.mercadopago.exponential-backoff-multiplier=2

# Retry para order-service
resilience4j.retry.instances.order-service.max-attempts=3
resilience4j.retry.instances.order-service.wait-duration=1s

# TimeLimiter (timeout) para MercadoPago — 10 segundos máximo
resilience4j.timelimiter.instances.mercadopago.timeout-duration=10s
resilience4j.timelimiter.instances.mercadopago.cancel-running-future=true

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true

# ========================
# LOGS
# ========================
logging.level.co.empresa.payment_service=INFO
logging.level.io.github.resilience4j=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [payment-service] %logger{36} - %msg%n
