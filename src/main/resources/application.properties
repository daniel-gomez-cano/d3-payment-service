# ========================
# SERVIDOR
# ========================
server.port=8084

# ========================
# BASE DE DATOS
# ========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:paymentdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# KEYCLOAK
# ========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/viva-eventos}

# ========================
# STRIPE
# ========================
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.success-url=${STRIPE_SUCCESS_URL}
stripe.cancel-url=${STRIPE_CANCEL_URL}

# ========================
# OTROS SERVICIOS
# ========================
order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}

# ========================
# RESILIENCIA (Resilience4j)
# ========================

# Circuit Breaker para llamadas a Stripe
resilience4j.circuitbreaker.instances.stripe.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.stripe.sliding-window-size=10
resilience4j.circuitbreaker.instances.stripe.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stripe.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.stripe.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.stripe.register-health-indicator=true

# Circuit Breaker para llamadas al order-service
resilience4j.circuitbreaker.instances.order-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.order-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.order-service.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.order-service.register-health-indicator=true

# Retry para llamadas a Stripe (3 intentos, espera exponencial)
resilience4j.retry.instances.stripe.max-attempts=3
resilience4j.retry.instances.stripe.wait-duration=2s
resilience4j.retry.instances.stripe.enable-exponential-backoff=true
resilience4j.retry.instances.stripe.exponential-backoff-multiplier=2

# Retry para order-service
resilience4j.retry.instances.order-service.max-attempts=3
resilience4j.retry.instances.order-service.wait-duration=1s

# TimeLimiter (timeout) para Stripe — 10 segundos máximo
resilience4j.timelimiter.instances.stripe.timeout-duration=10s
resilience4j.timelimiter.instances.stripe.cancel-running-future=true

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true

# ========================
# LOGS
# ========================
logging.level.co.empresa.payment_service=INFO
logging.level.io.github.resilience4j=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [payment-service] %logger{36} - %msg%n



#=========================
# RABBITMQ
#=========================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

rabbitmq.exchange=${RABBITMQ_EXCHANGE:order.exchange}
rabbitmq.queue=${RABBITMQ_QUEUE:order.payment.queue}
rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:order.created}
